[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
lectern-core = { path = "crates/lectern-core", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
