[workspace]
members = ["crates/*"]
default-members = ["crates/lectern-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
directories = "6.0.0"
flate2 = "1.1.2"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "ff3eb1128ac1058f1bb88e777744ce1237aa3b79" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
isolang = { version = "2.4.0", default-features = false, features = ["english_names", "list_languages"] }
lectern-import = { path = "crates/lectern-import", version = "0.1.0" }
lectern-core = { path = "crates/lectern-core", version = "0.1.0" }
lectern-device = { path = "crates/lectern-device", version = "0.1.0" }
lectern-service = { path = "crates/lectern-service", version = "0.1.0" }
lectern-storage = { path = "crates/lectern-storage", version = "0.1.0" }
lectern-ui = { path = "crates/lectern-ui", version = "0.1.0" }
lopdf = { version = "0.44.0", default-features = false }
percent-encoding = "2.3.2"
quick-xml = "0.41.0"
rayon = "1.12.0"
rfd = "0.17.2"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
sysinfo = "=0.31.4"
tar = "0.4.44"
tempfile = "3.21.0"
thiserror = "2.0"
tracing = "0.1.44"
toml = "0.9.5"
ttf-parser = "0.25.1"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
